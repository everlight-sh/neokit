services:
  app:
    init: true
    stop_grace_period: 35s
    build:
      context: ..
      additional_contexts:
        neo: ${NEO_HOME:-../../neo}
        neo-libs: ../../neo-libs
      args:
        APP: examples/dashboard
    environment:
      NEO_THREADS: ${NEO_THREADS:-2}
      NEO_HTTP_CONNECTIONS: ${NEO_HTTP_CONNECTIONS:-1024}
      # Only the proxy can reach the app, so its network is trusted to supply
      # X-Forwarded-For; per-client login limits then see the real client.
      NEO_TRUSTED_PROXIES: ${NEOKIT_NETWORK:-172.30.94.0/24}
      NEOKIT_DATA_DIR: /data
      NEOKIT_CACHE_DIR: /cache
      NEOKIT_ORIGIN: https://${DOMAIN:?Set your domain}
      NEOKIT_SESSION_SECRET: ${NEOKIT_SESSION_SECRET:?Set a random secret of at least 32 bytes}
      NEOKIT_ADMIN_USER: ${NEOKIT_ADMIN_USER:-admin}
      NEOKIT_ADMIN_PASSWORD_HASH: ${NEOKIT_ADMIN_PASSWORD_HASH:?Generate with neokit password}
    volumes:
      - app-data:/data
      - app-cache:/cache
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /healthcheck, '8094']
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    mem_limit: ${NEOKIT_MEMORY_LIMIT:-1g}
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: ${NEOKIT_CADDY_IMAGE:-caddy:2.11.3}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set your domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    stop_grace_period: 35s
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: ${NEOKIT_NETWORK:-172.30.94.0/24}
volumes:
  app-data:
  app-cache:
  caddy-data:
  caddy-config:
