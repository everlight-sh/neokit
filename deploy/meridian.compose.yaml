services:
  app:
    image: ${NEOKIT_APP_IMAGE:-neokit-meridian:0.1.0-alpha.2}
    init: true
    build:
      context: ..
      additional_contexts:
        neo: ${NEOKIT_NEO_CONTEXT:-../../neo}
        neo-libs: ../../neo-libs
      args:
        APP: examples/saas
    environment:
      NEO_THREADS: ${NEO_THREADS:-2}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    healthcheck:
      test: [CMD, /healthcheck, '8094']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: ${NEOKIT_MEMORY_LIMIT:-512m}
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  proxy:
    image: ${NEOKIT_CADDY_IMAGE:-caddy:2.11.3}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - '${NEOKIT_BIND_IP:-0.0.0.0}:${NEOKIT_HTTP_PORT:-80}:80'
      - '${NEOKIT_BIND_IP:-0.0.0.0}:${NEOKIT_HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile.meridian:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/Caddyfile.routes:ro
      - caddy-data:/data
      - caddy-config:/config
    stop_grace_period: 35s
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
