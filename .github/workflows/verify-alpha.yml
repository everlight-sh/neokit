name: Verify alpha SDK

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: HTTPS URL of the staged NeoKit SDK archive
        required: true
      sha256:
        description: SHA-256 of that archive
        required: true

permissions:
  contents: read

jobs:
  clean-install-and-https:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld python3 binutils
      - name: Verify the staged archive and relocated starter
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.sha256 }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/neokit.tar.gz" -- "$ARCHIVE_URL"
          python3 tests/alpha_release.py --archive "$RUNNER_TEMP/neokit.tar.gz" --sha256 "$ARCHIVE_SHA256"
      - name: Deploy Meridian over HTTPS
        run: |
          framework=$(python3 -c 'from pathlib import Path; import sys; from tests.alpha_release import unpack; print(unpack(Path(sys.argv[1]), Path(sys.argv[2]))/"framework")' "$RUNNER_TEMP/neokit.tar.gz" "$RUNNER_TEMP/sdk")
          python3 tests/alpha_https.py --framework "$framework" --out "$RUNNER_TEMP/https.json"
