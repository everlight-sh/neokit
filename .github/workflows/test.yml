name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Compiler and browser unit tests; they need no native Neo toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: bun install --frozen-lockfile
      - name: Compiler unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser runtime tests
        run: bun test ./client
